<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bobby van der Sluis</title>
</head>
<body>
  <script>
    const pages   = ['index-000.html', 'index-001.html', 'index-002.html', 'index-004.html'];
    const from    = new URLSearchParams(location.search).get('from');
    const exclude = from ? `index-${from}.html` : '';
    const pool    = pages.filter(p => p !== exclude);
    location.replace(pool[Math.floor(Math.random() * pool.length)]);
  </script>
</body>
</html>
