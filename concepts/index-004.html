<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bobby van der Sluis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double:wght@500&family=Space+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #030806;
      user-select: none;
    }

    /* Surname + tagline: HTML overlay beneath the WebGL canvas.
       "Bobby" is rendered by the WebGL pipeline (rays pass through it).
       These two lines sit below it with no ray effect. */
    .lower {
      position: fixed;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.0rem;
      pointer-events: none;
      /* top: set by JS once font metrics are known */
    }

    .surname {
      font-family: 'Space Mono', monospace;
      font-weight: 400;
      font-size: clamp(1.0rem, 2.4vw, 1.8rem);
      letter-spacing: 0.18em;
      color: rgba(160, 220, 145, 0.68);
    }

    h2 {
      font-family: 'Space Mono', monospace;
      font-weight: 400;
      font-size: clamp(0.55rem, 1.1vw, 0.78rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(155, 225, 140, 0.62);
    }

    .ring-link {
      position: fixed;
      bottom: 1.5rem;
      left: 1.75rem;
      font-family: 'Bitcount Prop Double', monospace;
      font-size: clamp(0.50rem, 0.85vw, 0.65rem);
      letter-spacing: 0.14em;
      text-transform: lowercase;
      color: rgba(140, 220, 130, 0.42);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .ring-link:hover { color: rgba(160, 240, 150, 0.70); }
  </style>
</head>
<body>

  <!--
    h1 is visually rendered by WebGL (rays pass through the letterforms).
    A screen-reader-only version is kept in the DOM for accessibility.
  -->
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;
             clip:rect(0 0 0 0);white-space:nowrap">Bobby van der Sluis</h1>

  <div class="lower" id="lower" aria-hidden="true">
    <span class="surname">van der Sluis</span>
    <h2>Creative Technologist, the Netherlands</h2>
  </div>

  <a href="random.html?from=004" class="ring-link">Follow the ray of light →</a>

  <script>
  /*
   * Volumetric light scattering — four-pass WebGL pipeline.
   *
   * Technique: "Volumetric Light Scattering as a Post-Process"
   * Kenny Mitchell, GPU Gems 3 (2008).
   *
   * Pass 1 — Occluder: Black wall with transparent "Bobby" letter cutouts,
   *           rendered over a white cleared background (the light source).
   *           Rays pass only through the letter-shaped holes in the wall.
   * Pass 2 — God rays: full-screen shader marches 100 samples per pixel
   *           from current UV toward the light source, accumulating the
   *           occluder with exponential decay. Output: ray buffer.
   * Pass 3 — Composite: dark background + screen-blend rays + radial vignette,
   *           written directly to the screen. Letterforms are defined purely
   *           by the rays — no separate text overlay sits on top.
   *
   * Animation: light source drifts gently (sin oscillation) and follows
   * the mouse / touch position so rays shift as the cursor moves.
   * Exposure pulses slowly for the "breathing" quality of the original.
   */
  document.fonts.ready.then(main);

  function main() {
    let W = window.innerWidth;
    let H = window.innerHeight;

    // ── Renderer ───────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(W, H);
    Object.assign(renderer.domElement.style, {
      position: 'fixed', inset: '0', width: '100%', height: '100%',
      touchAction: 'none',   // prevent iOS scroll hijacking on touch
    });
    // Insert canvas behind the HTML overlays
    document.body.insertBefore(renderer.domElement, document.body.firstChild);

    // Orthographic camera — world space spans exactly (-1,1) x (-1,1)
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -1, 1);

    // ── Render targets ─────────────────────────────────
    const rtOpts = {
      minFilter:    THREE.LinearFilter,
      magFilter:    THREE.LinearFilter,
      format:       THREE.RGBAFormat,
      depthBuffer:  false,
      stencilBuffer:false,
    };
    let rtOcc  = new THREE.WebGLRenderTarget(W, H, rtOpts);
    let rtRays = new THREE.WebGLRenderTarget(W, H, rtOpts);
    let rtCol  = new THREE.WebGLRenderTarget(W, H, rtOpts);

    // ── Canvas textures ────────────────────────────────
    // Two canvases: one for the occluder pass, one for the colour pass.
    // Both are rebuilt on resize (canvas must match screen resolution so
    // the full-screen plane textures pixel-perfectly).
    const occCvs = document.createElement('canvas');
    const colCvs = document.createElement('canvas');
    const occCtx = occCvs.getContext('2d');
    const colCtx = colCvs.getContext('2d');
    const occTex = new THREE.CanvasTexture(occCvs);
    const colTex = new THREE.CanvasTexture(colCvs);

    let fontSize = 0, textY = 0;

    function buildTextures() {
      occCvs.width = colCvs.width = W;
      occCvs.height = colCvs.height = H;

      // Font: target 28% of viewport height, but cap so "Bobby" never
      // overflows horizontally — critical on portrait mobile.
      fontSize = H * 0.28;
      textY    = H * 0.44;
      // Measure at the target size, then scale down if it exceeds 88% of width.
      occCtx.font = `500 ${fontSize}px 'Bitcount Prop Double', monospace`;
      const measured = occCtx.measureText('Bobby').width;
      if (measured > W * 0.88) fontSize *= (W * 0.88) / measured;
      const fontStr = `500 ${fontSize}px 'Bitcount Prop Double', monospace`;

      // Occluder (wall) pass: solid black canvas with transparent letter holes.
      // Rendered over a white cleared background (the "light source" behind the wall).
      // The white background is only visible through the cutouts → rays trace through letters.
      occCtx.fillStyle = '#000';
      occCtx.fillRect(0, 0, W, H);
      occCtx.globalCompositeOperation = 'destination-out';
      occCtx.fillStyle = 'rgba(255,255,255,1)';
      occCtx.font = fontStr;
      occCtx.textAlign    = 'center';
      occCtx.textBaseline = 'middle';
      occCtx.fillText('Bobby', W * 0.5, textY);
      occCtx.globalCompositeOperation = 'source-over';

      // Colour pass: transparent background + warm orange text.
      colCtx.clearRect(0, 0, W, H);
      colCtx.fillStyle = '#f09060';
      colCtx.font = fontStr;
      colCtx.textAlign    = 'center';
      colCtx.textBaseline = 'middle';
      colCtx.fillText('Bobby', W * 0.5, textY);

      occTex.needsUpdate = true;
      colTex.needsUpdate = true;
    }

    // ── Shared full-screen quad geometry ───────────────
    // A single 2×2 plane in NDC covers the entire camera view.
    const quad = new THREE.PlaneBufferGeometry(2, 2);

    // ── Pass 1: Occluder scene ─────────────────────────
    // The wall mesh is a transparent black canvas with letter-shaped holes.
    // It renders over a white cleared background (Pass 1 clear colour = white).
    // The white light shines through the holes; the black wall blocks everything else.
    const occScene = new THREE.Scene();

    const wallMesh = new THREE.Mesh(
      quad,
      new THREE.MeshBasicMaterial({ map: occTex, transparent: true, depthTest: false })
    );
    occScene.add(wallMesh);

    // ── Pass 2: God-ray shader ─────────────────────────
    /*
     * Classic GPU Gems 3 volumetric scatter:
     *   For each fragment, march 100 steps from vUv toward lightPos.
     *   Each step samples the occluder and multiplies by exponential decay.
     *   Accumulated result × rayColor × exposure = ray buffer.
     */
    const rayUniforms = {
      tOccluder : { value: rtOcc.texture },
      lightPos  : { value: new THREE.Vector2(0.5, 0.56) },  // UV of text centre
      exposure  : { value: 0.32 },
      decay     : { value: 0.945 },
      density   : { value: 0.84 },
      weight    : { value: 0.42 },
      rayColor  : { value: new THREE.Vector3(0.45, 1.00, 0.32) }, // white-to-green
    };

    const rayScene = new THREE.Scene();
    rayScene.add(new THREE.Mesh(quad, new THREE.ShaderMaterial({
      uniforms: rayUniforms,
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform sampler2D tOccluder;
        uniform vec2      lightPos;
        uniform float     exposure;
        uniform float     decay;
        uniform float     density;
        uniform float     weight;
        uniform vec3      rayColor;
        varying vec2      vUv;

        const int SAMPLES = 100;

        void main() {
          vec2  tc    = vUv;
          vec2  delta = (tc - lightPos) * (1.0 / float(SAMPLES)) * density;
          float d     = 1.0;
          vec3  col   = vec3(0.0);

          // Chromatic aberration on the occluder sample: R/B channels are offset
          // radially from the light source, splitting ray edges into a spectrum fringe.
          // Aberration grows with distance from lightPos — stronger at the periphery.
          vec2 aberr = (lightPos - vUv) * 0.024;

          for (int i = 0; i < SAMPLES; i++) {
            tc  -= delta;
            // step() binarises the sample — snaps anti-aliased letter edges to
            // hard 0/1 so there is no dim halo at the boundary of each cutout.
            float sr = step(0.5, texture2D(tOccluder, tc + aberr).r);  // R toward light
            float sg = step(0.5, texture2D(tOccluder, tc       ).g);   // G centered
            float sb = step(0.5, texture2D(tOccluder, tc - aberr).b);  // B away from light
            vec3  s  = vec3(sr, sg, sb) * d * weight;
            col += s;
            d   *= decay;
          }

          gl_FragColor = vec4(col * rayColor * exposure, 1.0);
        }
      `,
    })));

    // ── Pass 3: Colour text scene ──────────────────────
    const colScene = new THREE.Scene();
    colScene.add(new THREE.Mesh(
      quad,
      new THREE.MeshBasicMaterial({ map: colTex, transparent: true })
    ));

    // ── Pass 4: Composite shader ───────────────────────
    /*
     * 1. Fill dark warm background.
     * 2. Screen-blend ray buffer over background — adds light without
     *    washing out the background colour.
     * 3. Overlay the warm amber "Bobby" text on top.
     * 4. Radial vignette to focus attention on the centre.
     */
    const compUniforms = {
      tRays   : { value: rtRays.texture },
      bgColor : { value: new THREE.Vector3(0.010, 0.022, 0.010) },
      lightPos: { value: new THREE.Vector2(0.5, 0.56) },
    };

    const compScene = new THREE.Scene();
    compScene.add(new THREE.Mesh(quad, new THREE.ShaderMaterial({
      uniforms: compUniforms,
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform sampler2D tRays;
        uniform vec3      bgColor;
        uniform vec2      lightPos;
        varying vec2      vUv;

        void main() {
          // Screen-space chromatic aberration: R/B channels sampled at UV offsets
          // that grow toward the screen edges — like a real lens CA.
          vec2  ssAberr = (vUv - 0.5) * 0.014;
          vec3  rays;
          rays.r = texture2D(tRays, vUv + ssAberr).r;
          rays.g = texture2D(tRays, vUv          ).g;
          rays.b = texture2D(tRays, vUv - ssAberr).b;

          // Background
          vec3 col = bgColor;

          // Screen blend: rays add light without blowing out background.
          col = 1.0 - (1.0 - col) * (1.0 - rays);

          // Anamorphic lens streak: a thin horizontal band of cool teal light
          // crossing the frame at the light source's Y position.
          float dy     = vUv.y - lightPos.y;
          float streak = exp(-dy * dy * 550.0);                    // thin vertically
          streak      *= exp(-abs(vUv.x - lightPos.x) * 1.5);     // fades left and right
          col         += vec3(0.10, 0.75, 0.60) * streak * 0.26;  // cool teal tint

          // Radial vignette — darkens corners, focuses centre
          vec2  uv = vUv - 0.5;
          float v  = 1.0 - dot(uv, uv) * 2.2;
          col *= clamp(v, 0.0, 1.0);

          gl_FragColor = vec4(col, 1.0);
        }
      `,
    })));

    // ── Lower-text overlay positioning ─────────────────
    function positionLower() {
      // Place "van der Sluis" just below where "Bobby" ends.
      // textY is the baseline-middle; fontSize * 0.52 is approx half-height.
      const gap = H * 0.022;
      document.getElementById('lower').style.top =
        (textY + fontSize * 0.52 + gap) + 'px';
    }

    // ── Light position state ────────────────────────────
    // Stored in world space (x: −1..1, y: −1..1).
    let lx = 0, ly = 0.12;    // current (smoothed) — centred on "Bobby"
    let tlx = 0, tly = 0.12;  // target

    // Convert world → UV for the god-ray shader
    function worldToUV(wx, wy) {
      return new THREE.Vector2((wx + 1) * 0.5, (wy + 1) * 0.5);
    }

    // ── Auto-animation state ─────────────────────────────
    // When there is no user interaction the light sweeps left↔right with an
    // ease-in-out curve, short pauses at the extremes, and longer pauses over
    // the letterforms where the brand is most visible.
    // Cycle breakdown (phase 0→1, ~12 s):
    //   0.00–0.05  pause at left       (short)
    //   0.05–0.20  ease left → center
    //   0.20–0.35  pause at center     (long — "Bobby" fully lit)
    //   0.35–0.50  ease center → right
    //   0.50–0.55  pause at right      (short)
    //   0.55–0.70  ease right → center
    //   0.70–0.85  pause at center     (long — "Bobby" fully lit)
    //   0.85–1.00  ease center → left (wraps)
    const AUTO_RANGE    = 0.78;  // world-space half-width of sweep (±)
    const AUTO_DURATION = 12.0;  // seconds per full cycle
    const IDLE_DELAY    = 2000;  // ms of inactivity before auto resumes

    let autoPhase     = 0.05;  // start at the beginning of the first sweep (left → center)
    let isInteracting = false;
    let idleTimer     = null;

    // Random center-pause positions — one of the three middle letters of "Bobby".
    // Two slots: one per center pause in the cycle. Each is picked at the START
    // of the inbound sweep so the sweep has a known target throughout.
    // ±0.20 world units ≈ one letter-width either side of dead-center.
    const CENTER_OFFSETS = [-0.20, 0, 0.20];
    let centerPos        = [0, 0]; // [first pause, second pause]
    let centerSegment    = -1;     // which approach-segment is active (-1 = neither)
    let prevCenterSeg    = -1;     // used to detect segment transitions for Y pick
    let autoYTarget      = 0.12;   // current random Y target (updated each segment)

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function onPointer(clientX, clientY) {
      // Any pointer activity marks the session as interactive and resets the
      // idle countdown; auto-animation resumes IDLE_DELAY ms after the last move.
      isInteracting = true;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { isInteracting = false; }, IDLE_DELAY);

      const rect = renderer.domElement.getBoundingClientRect();
      const sx = clientX - rect.left;
      const sy = clientY - rect.top;
      tlx = ((sx / rect.width)  - 0.5) * 1.8;
      tly = 0.12 + (0.5 - sy / rect.height) * 0.55;
    }

    document.addEventListener('mousemove', e => onPointer(e.clientX, e.clientY));
    document.addEventListener('touchstart', e =>
      onPointer(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    document.addEventListener('touchmove', e => {
      e.preventDefault();
      onPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    document.addEventListener('touchend', () => {
      // Finger lifted — start the idle countdown (same as mouse going quiet)
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { isInteracting = false; }, IDLE_DELAY);
    });

    // ── Resize ──────────────────────────────────────────
    window.addEventListener('resize', () => {
      W = window.innerWidth; H = window.innerHeight;
      renderer.setSize(W, H);
      rtOcc.setSize(W, H); rtRays.setSize(W, H); rtCol.setSize(W, H);
      buildTextures();
      positionLower();
    });

    // ── Init ────────────────────────────────────────────
    buildTextures();
    positionLower();

    // ── Render loop ─────────────────────────────────────
    const clock = new THREE.Clock();
    let prevT = 0;

    function animate() {
      requestAnimationFrame(animate);
      const t  = clock.getElapsedTime();
      const dt = Math.min(t - prevT, 0.1); // cap so tab-switch doesn't jump
      prevT = t;

      // ── Auto-animation (runs only when no user interaction) ──────
      if (!isInteracting) {
        autoPhase = (autoPhase + dt / AUTO_DURATION) % 1;

        let ax;
        // Pick the random center target at the START of each inbound sweep so the
        // sweep has a known destination throughout.
        // Segment 0: left→center sweep + first pause  (0.05–0.35)
        // Segment 1: right→center sweep + second pause (0.55–0.85)
        if      (autoPhase >= 0.05 && autoPhase < 0.35 && centerSegment !== 0) {
          centerSegment = 0;
          centerPos[0]  = CENTER_OFFSETS[Math.floor(Math.random() * CENTER_OFFSETS.length)];
        } else if (autoPhase >= 0.55 && autoPhase < 0.85 && centerSegment !== 1) {
          centerSegment = 1;
          centerPos[1]  = CENTER_OFFSETS[Math.floor(Math.random() * CENTER_OFFSETS.length)];
        } else if (autoPhase < 0.05 || (autoPhase >= 0.35 && autoPhase < 0.55) || autoPhase >= 0.85) {
          centerSegment = -1;
        }

        // Each time we transition to a new segment, pick a fresh random Y target.
        // This gives gentle vertical drift — a different angle of light each sweep.
        if (centerSegment !== prevCenterSeg) {
          autoYTarget  = 0.12 + (Math.random() - 0.5) * 0.38;
          prevCenterSeg = centerSegment;
        }

        const c0 = centerPos[0], c1 = centerPos[1];
        if      (autoPhase < 0.05) ax = -AUTO_RANGE;                                                                  // pause left  (short)
        else if (autoPhase < 0.20) ax = -AUTO_RANGE + (AUTO_RANGE + c0) * easeInOut((autoPhase - 0.05) / 0.15);     // left → c0
        else if (autoPhase < 0.35) ax = c0;                                                                            // pause at c0 (long)
        else if (autoPhase < 0.50) ax = c0 + (AUTO_RANGE - c0)          * easeInOut((autoPhase - 0.35) / 0.15);     // c0 → right
        else if (autoPhase < 0.55) ax =  AUTO_RANGE;                                                                  // pause right (short)
        else if (autoPhase < 0.70) ax =  AUTO_RANGE - (AUTO_RANGE - c1) * easeInOut((autoPhase - 0.55) / 0.15);     // right → c1
        else if (autoPhase < 0.85) ax = c1;                                                                            // pause at c1 (long)
        else                       ax = c1 - (AUTO_RANGE + c1)          * easeInOut((autoPhase - 0.85) / 0.15);     // c1 → left

        tlx = ax;
        // Vertical target drifts toward the current random Y — different each segment
        tly += (autoYTarget - tly) * 0.015;
      }

      // Smooth light toward target (interaction or auto)
      lx += (tlx - lx) * 0.05;
      ly += (tly - ly) * 0.05;

      // Add gentle organic drift (the "breathing" quality)
      const fx = lx + Math.sin(t * 0.40) * 0.018;
      const fy = ly + Math.sin(t * 0.27) * 0.013;

      // Sync ray shader + composite shader light position (streak needs it too)
      const lightUV = worldToUV(fx, fy);
      rayUniforms.lightPos.value.copy(lightUV);
      compUniforms.lightPos.value.copy(lightUV);

      // Pulse exposure — subtle living quality
      rayUniforms.exposure.value = 0.30 + Math.sin(t * 0.72) * 0.06;

      // Pass 1 — occluder (white bg = light source; wall mesh renders on top)
      renderer.setClearColor(0xffffff, 1);
      renderer.setRenderTarget(rtOcc);
      renderer.render(occScene, camera);

      // Pass 2 — god rays
      renderer.setRenderTarget(rtRays);
      renderer.render(rayScene, camera);

      // Pass 3 — composite to screen
      renderer.setRenderTarget(null);
      renderer.render(compScene, camera);
    }

    animate();
  }
  </script>
</body>
</html>
